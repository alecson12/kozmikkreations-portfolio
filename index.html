    <!-- Google Analytics 4. Paste the Measurement ID (G-XXXXXXXXXX) between the quotes.
         While it is empty, nothing is loaded and nothing is sent. -->
    <script>
      var GA_ID = 'G-8QL1N29D9P'
      if (GA_ID) {
        var ga = document.createElement('script')
        ga.async = true
        ga.src = 'https://www.googletagmanager.com/gtag/js?id=' + encodeURIComponent(GA_ID)
        document.head.appendChild(ga)
        window.dataLayer = window.dataLayer || []
        // also used by src/App.jsx, which reports each page inside the site
        window.gtag = function () {
          dataLayer.push(arguments)
        }
        gtag('js', new Date())
        gtag('config', GA_ID)
      }
    </script>
